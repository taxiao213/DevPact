name: Build and Release

on:
  push:
    tags:
      - 'DEV_PACT*'

env:
  PYTHON_VERSION: '3.12'

jobs:
  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller build.spec --noconfirm

      - name: Create DMG
        run: |
          brew install create-dmg || true
          create-dmg \
            --volname "DevPact" \
            --window-pos 200 120 \
            --window-size 800 450 \
            --icon-size 100 \
            --icon "DevPact.app" 200 190 \
            --hide-extension "DevPact.app" \
            --app-drop-link 600 185 \
            "dist/DevPact-macOS-arm64.dmg" \
            "dist/DevPact.app" || true
          
          if [ ! -f "dist/DevPact-macOS-arm64.dmg" ]; then
            hdiutil create -volname "DevPact" -srcfolder "dist/DevPact.app" -ov -format UDZO "dist/DevPact-macOS-arm64.dmg"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevPact-macOS-arm64
          path: |
            dist/DevPact-macOS-arm64.dmg
            dist/DevPact.app

  build-macos-x64:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python (x86_64 via Rosetta)
        run: |
          # Install x86_64 Python using Rosetta 2
          arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" || true
          
          # Use conda for x86_64 Python
          curl -o ~/miniconda.sh https://repo.anaconda.com/miniconda/Miniconda3-latest-MacOSX-x86_64.sh
          /bin/bash ~/miniconda.sh -b -p $HOME/miniconda
          echo "$HOME/miniconda/bin" >> $GITHUB_PATH
          
          # Verify architecture
          $HOME/miniconda/bin/python -c "import platform; print(platform.machine())"

      - name: Install dependencies (x86_64)
        run: |
          $HOME/miniconda/bin/pip install --upgrade pip
          $HOME/miniconda/bin/pip install -r requirements.txt

      - name: Build with PyInstaller (x86_64)
        run: |
          $HOME/miniconda/bin/pyinstaller build.spec --noconfirm

      - name: Verify architecture
        run: |
          file dist/DevPact.app/Contents/MacOS/DevPact

      - name: Create DMG
        run: |
          brew install create-dmg || true
          create-dmg \
            --volname "DevPact" \
            --window-pos 200 120 \
            --window-size 800 450 \
            --icon-size 100 \
            --icon "DevPact.app" 200 190 \
            --hide-extension "DevPact.app" \
            --app-drop-link 600 185 \
            "dist/DevPact-macOS-x64.dmg" \
            "dist/DevPact.app" || true
          
          if [ ! -f "dist/DevPact-macOS-x64.dmg" ]; then
            hdiutil create -volname "DevPact" -srcfolder "dist/DevPact.app" -ov -format UDZO "dist/DevPact-macOS-x64.dmg"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevPact-macOS-x64
          path: |
            dist/DevPact-macOS-x64.dmg
            dist/DevPact.app

  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: 'x64'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller build.spec --noconfirm

      - name: Create ZIP archive
        run: |
          Compress-Archive -Path dist/DevPact -DestinationPath dist/DevPact-Windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevPact-Windows-x64
          path: dist/DevPact-Windows-x64.zip

  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libglib2.0-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxkbcommon-x11-0 \
            libxkbcommon0 \
            libdbus-1-3 \
            libegl1 \
            libfontconfig1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller build.spec --noconfirm

      - name: Create TAR archive
        run: |
          tar -czvf dist/DevPact-Linux-x64.tar.gz -C dist DevPact

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevPact-Linux-x64
          path: dist/DevPact-Linux-x64.tar.gz

  release:
    needs:
      - build-macos-arm64
      - build-macos-x64
      - build-windows-x64
      - build-linux-x64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## DevPact ${{ github.ref_name }}
            
            ### Downloads
            
            | Platform | Architecture | Download |
            |----------|--------------|----------|
            | macOS | ARM64 (Apple Silicon M1/M2/M3) | DevPact-macOS-arm64.dmg |
            | macOS | x86-64 (Intel) | DevPact-macOS-x64.dmg |
            | Windows | x86-64 | DevPact-Windows-x64.zip |
            | Linux | x86-64 | DevPact-Linux-x64.tar.gz |
            
            ### Notes
            - **macOS ARM64**: For Apple Silicon Macs (M1/M2/M3)
            - **macOS x86-64**: For Intel-based Macs
            - **Windows x86-64**: For 64-bit Windows systems
            - **Linux x86-64**: For 64-bit Linux systems
            
            ### What's Changed
            See [CHANGELOG.md](CHANGELOG.md) for details.
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
          draft: false
          prerelease: false

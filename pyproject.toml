[project]
name = "multi-agent-dev"
version = "1.0.0"
description = "Multi-Agent collaborative development system"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "PyQt6>=6.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]
build = [
    "pyinstaller>=6.0.0",
]

[project.scripts]
multi-agent-cli = "main:main"
multi-agent-gui = "app:main"

[tool.setuptools]
py-modules = ["state", "agents", "discussion", "workflow", "main", "code_reader", "app"]

[tool.pyinstaller]
name = "MultiAgentDev"
onefile = true
windowed = true
